services:
  app:
    build: .
    container_name: legal_app
    restart: unless-stopped
    environment:
      # Postgres + pgvector lives on Neon, not in a container — set the full
      # connection string (with ?sslmode=require) in .env. The corpus is
      # already ingested there.
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL (Neon) in .env}

      # Chat and embeddings are separate settings: Claude has no embeddings
      # endpoint, so a single provider variable could not express "Claude for
      # answers, OpenAI for vectors".
      CHAT_PROVIDER: ${CHAT_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-4-8}

      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1536}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      LAWYER_SESSION_SECRET: ${LAWYER_SESSION_SECRET}
      IP_HASH_SALT: ${IP_HASH_SALT}
      # Must equal Dostoori's AI_LEGAL_SERVICE_KEY.
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      STORAGE_DIR: /data/storage
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-8}
      RETRIEVAL_MIN_SCORE: ${RETRIEVAL_MIN_SCORE:-0.30}
      ALLOW_GENERAL_FALLBACK: ${ALLOW_GENERAL_FALLBACK:-true}
      NODE_ENV: production
    ports:
      # 4000 on the host (Dostoori's dev convention) -> 3000 inside. Loopback
      # only; nginx (legal.<domain>) is the public entrance, and Dostoori
      # reaches this container as `legal_app:3000` over dostoori_net.
      - "127.0.0.1:4000:3000"
    volumes:
      # Uploaded PDFs must outlive the container — they are the only copy, and
      # a re-index reads them back from here.
      - ./storage:/data/storage
    networks:
      - default
      - dostoori_net
    deploy:
      resources:
        limits:
          # A hard ceiling so an OCR run on a huge scan gets OOM-killed on its
          # own instead of taking the box down with it.
          memory: 1800M

networks:
  # Created by dostoori/deploy/setup-vps.sh: `docker network create dostoori_net`.
  # Shared with ../docker-compose.yml so Dostoori resolves `legal_app` by name.
  dostoori_net:
    external: true
